name: Verificar aprovações
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada ~10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agente
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - name: Processar aprovações e publicar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m agent.main poll
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "agente-instagram"
          git config user.email "agente@users.noreply.github.com"
          git add -A queue state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado do agente" && git pull --rebase && git push)
