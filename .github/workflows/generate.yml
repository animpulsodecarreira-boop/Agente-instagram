name: Gerar post
on:
  schedule:
    - cron: "30 15 * * 1-5"   # 12:30 Brasília, de segunda a sexta: 1 carrossel por dia (a etapa do funil gira pelo dia da semana)
    - cron: "30 13 * * 6,0"   # sábado e domingo 10:30 Brasília -> LEVE
    - cron: "0 20 * * 6,0"    # sábado e domingo 17:00 Brasília -> LEVE
  workflow_dispatch:
    inputs:
      funnel:
        description: "Etapa do funil (vazio = pelo dia da semana)"
        required: false
        type: choice
        options: ["", "topo", "meio", "fundo", "leve"]
      tema:
        description: "Assunto sugerido (opcional), ex.: Direitos de estágio"
        required: false
        type: string
      outro:
        description: "Uso do botão Gerar outro: número do post a substituir (deixe vazio)"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: agente
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg (vídeo dos stories), repetindo se a rede do GitHub falhar
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # cada chamada do apt tem tempo máximo; a rede do GitHub às vezes trava na resolução de nomes
            for i in 1 2; do
              sudo timeout 100 apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true update -qq || true
              sudo timeout 150 apt-get install -y -qq ffmpeg && break
              echo "apt falhou (tentativa $i)"; sleep 15
            done
          fi
          if ! command -v ffmpeg >/dev/null; then
            echo "Usando o ffmpeg empacotado no pip (plano B)"
            pip install imageio-ffmpeg
            sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Instalar dependências e o Chromium (com repetição)
        timeout-minutes: 8
        run: |
          pip install -r requirements.txt
          for i in 1 2 3; do
            timeout 240 playwright install --with-deps chromium && break
            echo "tentativa $i falhou; aguardando"; sleep $((i*20))
          done
      - name: Definir a etapa do funil
        id: f
        run: |
          F="${{ inputs.funnel }}"
          if [ -z "$F" ]; then
            # segunda topo | terça meio | quarta topo | quinta fundo | sexta meio | sábado e domingo leve
            case "$(TZ=America/Sao_Paulo date +%u)" in
              1) F="topo" ;;
              2) F="meio" ;;
              3) F="topo" ;;
              4) F="fundo" ;;
              5) F="meio" ;;
              *) F="leve" ;;
            esac
          fi
          echo "funnel=$F" >> "$GITHUB_OUTPUT"
      - name: Gerar, renderizar e enviar para o Telegram
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUNNEL: ${{ steps.f.outputs.funnel }}
          TEMA: ${{ inputs.tema }}
          OUTRO: ${{ inputs.outro }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MIDIA_PUBLIC_URL: ${{ secrets.MIDIA_PUBLIC_URL }}
        run: |
          args=()
          if [ -n "$FUNNEL" ]; then args+=(--funnel "$FUNNEL"); fi
          if [ -n "$TEMA" ]; then args+=(--tema "$TEMA"); fi
          if [ -n "$OUTRO" ]; then args+=(--outro "$OUTRO"); fi
          python -m agent.main generate "${args[@]}"
      - name: Salvar imagens e vídeos no repositório (o Instagram busca pelas URLs)
        if: always()
        run: |
          git config user.name "agente-instagram"
          git config user.email "agente@users.noreply.github.com"
          rm -rf queue/*/_frames
          git add -A queue history.json 2>/dev/null || true
          git add -A temas.json 2>/dev/null || true
          git add -A temas.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "novo post" && git pull --rebase && git push)
      - name: Avisar no Telegram se algo falhou
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s --max-time 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Alerta automático: o workflow 'Gerar post' falhou ou travou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
 
 
