name: Gerar post
on:
  schedule:
    - cron: "0 11 * * 1-5"   # 08:00 em Brasília (UTC-3), segunda a sexta
  workflow_dispatch:
    inputs:
      funnel:
        description: "Etapa do funil (vazio = pela agenda da semana)"
        required: false
        type: choice
        options: ["", "topo", "meio", "fundo"]
permissions:
  contents: write
concurrency:
  group: agente
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Gerar, renderizar e enviar para o Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.funnel }}" ]; then
            python -m agent.main generate --funnel "${{ inputs.funnel }}"
          else
            python -m agent.main generate
          fi
      - name: Salvar imagens no repositório (necessário para o Instagram buscar as URLs)
        if: always()
        run: |
          git config user.name "agente-instagram"
          git config user.email "agente@users.noreply.github.com"
          git add -A queue history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "novo post" && git pull --rebase && git push)
