name: Gerar post
on:
  schedule:
    - cron: "0 11 * * 1-5"    # 08:00 Brasília -> TOPO
    - cron: "30 15 * * 1-5"   # 12:30 Brasília -> MEIO
    - cron: "0 21 * * 1-5"    # 18:00 Brasília -> FUNDO
    - cron: "30 13 * * 6,0"   # sábado e domingo 10:30 Brasília -> LEVE
    - cron: "0 20 * * 6,0"    # sábado e domingo 17:00 Brasília -> LEVE
  workflow_dispatch:
    inputs:
      funnel:
        description: "Etapa do funil (vazio = pela hora atual)"
        required: false
        type: choice
        options: ["", "topo", "meio", "fundo", "leve"]
permissions:
  contents: write
concurrency:
  group: agente
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg (vídeo dos stories)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Definir a etapa do funil
        id: f
        run: |
          F="${{ inputs.funnel }}"
          if [ -z "$F" ]; then
            case "${{ github.event.schedule }}" in
              "0 11 * * 1-5") F="topo" ;;
              "30 15 * * 1-5") F="meio" ;;
              "0 21 * * 1-5") F="fundo" ;;
              "30 13 * * 6,0") F="leve" ;;
              "0 20 * * 6,0") F="leve" ;;
            esac
          fi
          echo "funnel=$F" >> "$GITHUB_OUTPUT"
      - name: Gerar, renderizar e enviar para o Telegram
        timeout-minutes: 12
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ steps.f.outputs.funnel }}" ]; then
            python -m agent.main generate --funnel "${{ steps.f.outputs.funnel }}"
          else
            python -m agent.main generate
          fi
      - name: Salvar imagens e vídeos no repositório (o Instagram busca pelas URLs)
        if: always()
        run: |
          git config user.name "agente-instagram"
          git config user.email "agente@users.noreply.github.com"
          rm -rf queue/*/_frames
          git add -A queue history.json 2>/dev/null || true
          git add -A temas.json 2>/dev/null || true
          git add -A temas.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "novo post" && git pull --rebase && git push)
      - name: Avisar no Telegram se algo falhou
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s --max-time 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Alerta automático: o workflow 'Gerar post' falhou ou travou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
 
