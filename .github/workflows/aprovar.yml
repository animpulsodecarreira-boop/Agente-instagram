name: Aprovar post
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Número do post (aparece no Telegram, ex.: 20261021-0800)"
        required: true
        type: string
      action:
        description: "O que fazer"
        required: true
        default: "ap"
        type: choice
        options: ["ap", "po", "rj"]   # ap = post + stories | po = só o post | rj = rejeitar
permissions:
  contents: write
concurrency:
  group: agente
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - name: Aprovar e publicar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m agent.main approve --post-id "${{ inputs.post_id }}" --action "${{ inputs.action }}"
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "agente-instagram"
          git config user.email "agente@users.noreply.github.com"
          git add -A queue 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado do agente" && git pull --rebase && git push)
