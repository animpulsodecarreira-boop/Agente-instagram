name: Criar Reel
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Número do post (aparece no Telegram, ex.: 20261021-0800)"
        required: true
        type: string
      modo:
        description: "Estilo do Reel: texto = animação de texto no estilo dos stories | slides = carrossel em vídeo"
        required: false
        default: "texto"
        type: choice
        options: ["texto", "slides"]
permissions:
  contents: write
concurrency:
  group: agente
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg, repetindo se a rede do GitHub falhar
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # cada chamada do apt tem tempo máximo; a rede do GitHub às vezes trava na resolução de nomes
            for i in 1 2; do
              sudo timeout 100 apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true update -qq || true
              sudo timeout 150 apt-get install -y -qq ffmpeg && break
              echo "apt falhou (tentativa $i)"; sleep 15
            done
          fi
          if ! command -v ffmpeg >/dev/null; then
            echo "Usando o ffmpeg empacotado no pip (plano B)"
            pip install imageio-ffmpeg
            sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Instalar dependências e o Chromium (com repetição)
        timeout-minutes: 8
        run: |
          pip install requests playwright
          for i in 1 2 3; do
            timeout 240 playwright install --with-deps chromium && break
            echo "tentativa $i falhou; aguardando"; sleep $((i*20))
          done
      - name: Montar o Reel (texto animado, ou carrossel em vídeo se a animação falhar)
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_ID: ${{ inputs.post_id }}
          MODO: ${{ inputs.modo }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MIDIA_PUBLIC_URL: ${{ secrets.MIDIA_PUBLIC_URL }}
        run: python -m agent.main reel --post-id "$POST_ID" --modo "${MODO:-texto}"
      - name: Salvar o Reel no repositório (o Instagram busca pela URL)
        run: |
          git config user.name "agente-instagram"
          git config user.email "agente@users.noreply.github.com"
          git add -A queue 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "reel do post" && git pull --rebase && git push)
      - name: Enviar o Reel ao Telegram (só depois de salvo, para o botão Publicar já encontrar o arquivo)
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POST_ID: ${{ inputs.post_id }}
        run: python -m agent.main reel --post-id "$POST_ID" --enviar
      - name: Avisar no Telegram se algo falhou
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s --max-time 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Alerta automático: o workflow 'Criar Reel' falhou ou travou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
 
 
